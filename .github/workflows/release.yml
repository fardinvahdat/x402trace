name: Release

# Tag-triggered publish workflow. Activated in [X402-19](https://vahdatfardin.atlassian.net/browse/X402-19)
# for the v0.1.0 cut.
#
# Requires the `NPM_TOKEN` repo secret (npm Automation token with
# Publish scope on the `x402trace` package).
#
# Tag convention: `v<MAJOR>.<MINOR>.<PATCH>` (semver). Tags are created
# off the `main` branch after a `release/x.y.z` PR merges through
# v1 → staging → main per [CLAUDE.md § Branching strategy](../../CLAUDE.md#branching-strategy).

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate + publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # `contents: write` is required by the `gh release create` step
      # at the end of this job. The first v0.1.0 publish (X402-19)
      # succeeded at npm publish but failed the Release step with
      # `HTTP 403: Resource not accessible by integration` because we
      # initially set this to `read`. Future releases need write.
      contents: write
      # `id-token: write` is what npm wants for provenance signing.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false

      - name: Setup Node 20 + npm registry for publish
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality bar — typecheck + lint + tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build
        run: pnpm build

      - name: Verify tag matches package.json version
        # A tag of `v0.1.0` should publish version `0.1.0`. Bail early
        # if they drift — much better than catching it in npmjs.com.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "✓ tag $GITHUB_REF_NAME matches package.json version $PKG_VERSION"

      - name: Publish to npm
        # `prepublishOnly` re-runs `pnpm test && pnpm build` defensively;
        # the steps above have already covered both, so this is a fast
        # no-op. `--no-git-checks` is required in CI because we're not
        # on a branch (we're on a detached HEAD at the tag).
        # `--provenance` signs the publish via the GitHub Actions OIDC
        # token (the `id-token: write` permission above).
        run: pnpm publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release with CHANGELOG section
        # Surfaces the matching CHANGELOG.md section in the GitHub UI.
        # Skipped if the release already exists (idempotent re-tag).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; skipping"
            exit 0
          fi
          # Extract the matching `## [x.y.z]` section from CHANGELOG.md.
          # Falls back to a placeholder if the section isn't found.
          NOTES=$(awk -v ver="${TAG#v}" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; print; next }
            in_section && /^## / { exit }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](./CHANGELOG.md) for full details."
          fi
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
