name: CI

# Runs the full quality bar on every PR + every push to the integration
# branches. Matches what `pnpm typecheck && pnpm lint && pnpm test`
# would run locally on `v1`. The default `pnpm test` auto-skips
# `tests/e2e/` (gated on the `X402_E2E=1` env var) so the live-chain
# suite never burns Base Sepolia funds in CI.

on:
  pull_request:
    branches: [main, staging, v1]
  push:
    branches: [main, staging, v1]

# Cancel a pending run for the same ref when a fresher commit comes in
# (typical for force-pushes on a feature branch during review).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck + lint + tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
          run_install: false

      - name: Setup Node ${{ matrix.node }} with pnpm store cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        # `pnpm test` runs vitest in non-watch mode and auto-skips
        # tests/e2e/chain-live.test.ts (gated on X402_E2E=1).
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify publish surface
        # Caps the npm pack size + entry count and forbids any dist/
        # file from importing a devDependency. Prevents the v0.2.2
        # mistake (test-only deps classified as runtime) from coming
        # back. See scripts/check-publish-surface.mjs for the limits.
        run: node scripts/check-publish-surface.mjs
